<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:DateFont;src:url(FONT_URL)}
html,body{margin:0;width:1080px;height:1350px;overflow:hidden}
#c{position:relative;width:1080px;height:1350px;background:url(BG_URL)}
.stage{position:absolute;left:0;top:0;width:1080px;height:1350px;perspective:1500px;perspective-origin:540px 600px}
.book{position:absolute;transform-style:preserve-3d}
.book .f{position:absolute;inset:0;background-size:cover;backface-visibility:hidden}
.book .f::after{content:"";position:absolute;inset:0;
 background:linear-gradient(105deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.22) 45%,rgba(255,255,255,0) 60%),
 linear-gradient(90deg,rgba(0,0,0,.28) 0,rgba(0,0,0,.05) 2.5%,rgba(255,255,255,.12) 3.5%,rgba(0,0,0,0) 6%)}
.book .face{position:absolute}
.book .pg{top:3px;height:calc(100% - 6px);background:linear-gradient(90deg,rgba(60,40,20,.35),rgba(60,40,20,.12) 40%,rgba(60,40,20,.28)),repeating-linear-gradient(0deg,#efe6d2 0 1.5px,#cbbfa4 1.5px 2.5px);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.book .tp{left:0;width:calc(100% - 3px);background:linear-gradient(0deg,rgba(255,255,255,.2),rgba(0,0,0,.1)),repeating-linear-gradient(90deg,#efe6d2 0 1.5px,#cbbfa4 1.5px 2.5px)}
.book .bt{left:0;width:100%;background:#cfc7b4}
.book .sp{top:0;height:100%;filter:brightness(.6)}
.book .bk{inset:0;background:#2b2b2b}
.shadow{position:absolute;border-radius:50%;background:radial-gradient(ellipse at center,rgba(60,40,20,.45),rgba(60,40,20,0) 70%);filter:blur(6px)}
#date{position:absolute;left:LEFTpx;top:TOPpx;transform:translate(-50%,-50%) rotate(5deg);font-family:DateFont;font-size:36px;color:#C12D2E;white-space:nowrap;line-height:1}
</style></head><body><div id="c">
BOOKS
<div id="date">DATE</div>
</div></body></html>
